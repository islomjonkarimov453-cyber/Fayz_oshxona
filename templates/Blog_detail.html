{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .blog-detail-section {
        background: #f8f9fa;
        padding: 60px 0;
        min-height: 80vh;
    }

    .blog-container {
        background: #ffffff;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .blog-header {
        display: flex;
        gap: 30px;
        align-items: flex-start;
        margin-bottom: 40px;
    }

    .blog-image-small {
        flex: 0 0 300px;
        width: 300px;
        height: 300px;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .blog-image-small img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .blog-info {
        flex: 1;
    }

    .category-tag {
        background: #ff5e14;
        color: white;
        padding: 4px 12px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 700;
        display: inline-block;
        margin-bottom: 15px;
    }

    .blog-title {
        font-size: 32px;
        font-weight: 900;
        color: #002147;
        margin-bottom: 20px;
        line-height: 1.2;
    }

    .blog-full-text {
        font-size: 17px;
        line-height: 1.8;
        color: #444;
        border-top: 1px solid #eee;
        padding-top: 30px;
    }

    .back-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #ff5e14;
        font-weight: 700;
        text-decoration: none;
    }

    @media (max-width: 768px) {
        .blog-header { flex-direction: column; }
        .blog-image-small { width: 100%; flex: none; height: 250px; }
    }
</style>

<div class="blog-detail-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <a href="/" class="back-link">← Orqaga qaytish</a>

                <div class="blog-container">
                    <div class="blog-header">
                        {% if post.image %}
                        <div class="blog-image-small">
                            <img src="{{ post.image.url }}" alt="{{ post.title }}">
                        </div>
                        {% endif %}

                        <div class="blog-info">
                            <span class="category-tag">{{ post.category.name }}</span>
                            <h1 class="blog-title">{{ post.title }}</h1>
                            <p style="color: #666; font-style: italic;">
                                Sana: {{ post.created_at|date:"d.m.Y" }}
                            </p>
                        </div>
                    </div>

                    <div class="blog-full-text">
                        {{ post.description|linebreaks }}
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
