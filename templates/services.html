{% extends 'base.html' %}
{% block content %}

<div class="container mt-5 mb-5">
    <div class="text-center mb-5">
        <a class="nav-link" href="{% url 'all_services' %}">Yo'nalishlar</a>
    </div>

    <div class="row g-4">
        {% for service in services %}
        <div class="col-lg-4 col-md-6">
            <div class="service-card text-center p-4" style="background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); height: 100%;">
                <div class="icon-box mb-3" style="background: #fff5f0; width: 60px; height: 60px; border-radius: 15px; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
                    <img src="{{ service.icon.url }}" style="width: 30px;">
                </div>
                <h4 style="font-weight: 800; color: #002147;">{{ service.title }}</h4>
                <p style="color: #666; font-size: 14px;">{{ service.description|truncatechars:100 }}</p>
                <a href="{% url 'service_detail' service.pk %}" style="color: #ff5e14; font-weight: 700; text-decoration: none; text-transform: uppercase; font-size: 12px;">
                    Batafsil ma'lumot →
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
